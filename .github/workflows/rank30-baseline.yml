name: rank30-baseline-dual-cas

on:
  push:
    branches:
      - research/rank30-cas-20260806
    paths:
      - "rank30/**"
      - ".github/workflows/rank30-baseline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rank30/**"
      - ".github/workflows/rank30-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: dependency-free exact certificate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify deterministic research payload
        run: |
          echo "6f3dc067fe764f213950f82068c4eaae54da26f93cdeae43c7edba3288ea1463  rank30/payload.part.01" | sha256sum -c -
          echo "8ca971e5743dc78a6b43065a3309d2ff6aa1a47cfb8b70dea39cc969ff3703f5  rank30/payload.part.02" | sha256sum -c -
          echo "302eba0855246595546e703e02b411a97257f04670239fd8a2da4efd7ad6ca2d  rank30/payload.part.03" | sha256sum -c -
          echo "c5834288669ac39496fdd76d7b214f94e45ac4693c32d3d3f9deedf363e71926  rank30/payload.part.04" | sha256sum -c -
          cat rank30/payload.part.01 rank30/payload.part.02 rank30/payload.part.03 rank30/payload.part.04 > /tmp/rank30-payload.b64
          echo "62a7d1f83c2e3ca4ae2e85707019a270740b28cbea620a9917f1cb843e0423b1  /tmp/rank30-payload.b64" | sha256sum -c -
          base64 -d /tmp/rank30-payload.b64 > /tmp/rank30-payload.tar.gz
          echo "e373381129472924604689df1443d68dc2cb51c05390dc52193761e60523a28d  /tmp/rank30-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rank30-payload.tar.gz
      - name: Run exact verifier
        run: |
          mkdir -p rank30/results
          cd rank30
          python3 verify_exact.py | tee results/exact.log
          cp verify_e29_full_certificate.json results/
      - name: Hash exact inputs and results
        run: sha256sum rank30/curve.json rank30/points.json rank30/verify_exact.py rank30/results/* | tee rank30/results/SHA256SUMS.exact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank30-exact
          path: rank30/results
          if-no-files-found: error

  sage-core:
    name: SageMath 10.9 core and height matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify deterministic research payload
        run: |
          echo "6f3dc067fe764f213950f82068c4eaae54da26f93cdeae43c7edba3288ea1463  rank30/payload.part.01" | sha256sum -c -
          echo "8ca971e5743dc78a6b43065a3309d2ff6aa1a47cfb8b70dea39cc969ff3703f5  rank30/payload.part.02" | sha256sum -c -
          echo "302eba0855246595546e703e02b411a97257f04670239fd8a2da4efd7ad6ca2d  rank30/payload.part.03" | sha256sum -c -
          echo "c5834288669ac39496fdd76d7b214f94e45ac4693c32d3d3f9deedf363e71926  rank30/payload.part.04" | sha256sum -c -
          cat rank30/payload.part.01 rank30/payload.part.02 rank30/payload.part.03 rank30/payload.part.04 > /tmp/rank30-payload.b64
          echo "62a7d1f83c2e3ca4ae2e85707019a270740b28cbea620a9917f1cb843e0423b1  /tmp/rank30-payload.b64" | sha256sum -c -
          base64 -d /tmp/rank30-payload.b64 > /tmp/rank30-payload.tar.gz
          echo "e373381129472924604689df1443d68dc2cb51c05390dc52193761e60523a28d  /tmp/rank30-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rank30-payload.tar.gz
      - name: Run Sage core verifier
        run: |
          mkdir -p rank30/results
          sage -python rank30/verify_sage_core.py 2>&1 | tee rank30/results/sage_core.log
      - name: Hash outputs
        if: always()
        run: sha256sum rank30/curve.json rank30/points.json rank30/results/* 2>/dev/null | tee rank30/results/SHA256SUMS.sage-core || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank30-sage-core
          path: rank30/results
          if-no-files-found: warn

  sage-saturation-4095:
    name: SageMath saturation at all primes below 4096
    needs: sage-core
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify deterministic research payload
        run: |
          echo "6f3dc067fe764f213950f82068c4eaae54da26f93cdeae43c7edba3288ea1463  rank30/payload.part.01" | sha256sum -c -
          echo "8ca971e5743dc78a6b43065a3309d2ff6aa1a47cfb8b70dea39cc969ff3703f5  rank30/payload.part.02" | sha256sum -c -
          echo "302eba0855246595546e703e02b411a97257f04670239fd8a2da4efd7ad6ca2d  rank30/payload.part.03" | sha256sum -c -
          echo "c5834288669ac39496fdd76d7b214f94e45ac4693c32d3d3f9deedf363e71926  rank30/payload.part.04" | sha256sum -c -
          cat rank30/payload.part.01 rank30/payload.part.02 rank30/payload.part.03 rank30/payload.part.04 > /tmp/rank30-payload.b64
          echo "62a7d1f83c2e3ca4ae2e85707019a270740b28cbea620a9917f1cb843e0423b1  /tmp/rank30-payload.b64" | sha256sum -c -
          base64 -d /tmp/rank30-payload.b64 > /tmp/rank30-payload.tar.gz
          echo "e373381129472924604689df1443d68dc2cb51c05390dc52193761e60523a28d  /tmp/rank30-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rank30-payload.tar.gz
      - name: Saturate through prime 4095
        run: |
          mkdir -p rank30/results
          sage -python rank30/verify_sage_saturation.py --max-prime 4095 2>&1 | tee rank30/results/sage_saturation_driver.log
      - name: Hash outputs
        if: always()
        run: sha256sum rank30/curve.json rank30/points.json rank30/results/* 2>/dev/null | tee rank30/results/SHA256SUMS.sage-saturation || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank30-sage-saturation-4095
          path: rank30/results
          if-no-files-found: warn

  magma-online:
    name: independent Magma V2.29 free-calculator checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify deterministic research payload
        run: |
          echo "6f3dc067fe764f213950f82068c4eaae54da26f93cdeae43c7edba3288ea1463  rank30/payload.part.01" | sha256sum -c -
          echo "8ca971e5743dc78a6b43065a3309d2ff6aa1a47cfb8b70dea39cc969ff3703f5  rank30/payload.part.02" | sha256sum -c -
          echo "302eba0855246595546e703e02b411a97257f04670239fd8a2da4efd7ad6ca2d  rank30/payload.part.03" | sha256sum -c -
          echo "c5834288669ac39496fdd76d7b214f94e45ac4693c32d3d3f9deedf363e71926  rank30/payload.part.04" | sha256sum -c -
          cat rank30/payload.part.01 rank30/payload.part.02 rank30/payload.part.03 rank30/payload.part.04 > /tmp/rank30-payload.b64
          echo "62a7d1f83c2e3ca4ae2e85707019a270740b28cbea620a9917f1cb843e0423b1  /tmp/rank30-payload.b64" | sha256sum -c -
          base64 -d /tmp/rank30-payload.b64 > /tmp/rank30-payload.tar.gz
          echo "e373381129472924604689df1443d68dc2cb51c05390dc52193761e60523a28d  /tmp/rank30-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rank30-payload.tar.gz
      - name: Submit auditable Magma tasks
        run: |
          mkdir -p rank30/results
          python3 rank30/magma_free_verify.py 2>&1 | tee rank30/results/magma_driver.log
      - name: Hash outputs
        if: always()
        run: sha256sum rank30/curve.json rank30/points.json rank30/results/* 2>/dev/null | tee rank30/results/SHA256SUMS.magma || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank30-magma-free
          path: rank30/results
          if-no-files-found: warn
